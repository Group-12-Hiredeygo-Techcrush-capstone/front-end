<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Page Two</title>
    <link rel="stylesheet" href="interview-page-two.css">
     <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/boxi-icons/web@2.1.4/css/boxiicons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wdth,wght@0,87.5,100..900;1,87.5,100..900&family=Science+Gothic:wdth,wght,CTRS@87.5,100..900,26&family=Sekuya&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wdth,wght@0,87.5,100..900;1,87.5,100..900&family=Science+Gothic:wdth,wght,CTRS@87.5,100..900,26&family=Sekuya&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
</head>

 
<body>

    <section class="section-one">
        
        <h1 class="header-title">📅 Interview Schedule</h1>
    <p class="title-p">Candidates invited for interview — physical or virtual</p>

     <div class="main-div-left">
      <div class="init-box-container">
        <div class="init-bx">TA</div>
       <div class="boxes"><button class="boxes-btn-complete"><i class="ph-bold ph-check"></i><p class="last-box-p"> Interview Complete</p></button disabled></div>
      </div>


      <div class="info-bx">
        <h6 class="name-tag-title">Tolu Adeyemi</h6>
        <div class="info-grid-bx">
        <p class="job-description-p">UX Researcher · Lagos, Nigeria</p>
        <div class="btn-sections">
            <div class="boxes-one"><button class="boxes-btn-scheduled"><i class="ph-bold ph-paw-print paw" ></i></i><p class="scheduled-p">Product Designer</p></button disabled></button></div>
                <div class="boxes-two"><button class="boxes-btn-scheduled"><i class="ph-bold ph-handbag-simple" ></i></i><p class="scheduled-p"> UI/UX Design</p></button disabled></div>
                    <div class="boxes-three"><button class="boxes-btn-scheduled"><i class="ph-bold ph-building-office" ></i></i><p class="scheduled-p">Physical Interview</p></button disabled></div>
                    <div class="boxes-four"><button class="boxes-btn-scheduled"><i class="ph-bold ph-calendar" ></i></i><p class="scheduled-p">Mar 10, 2026</p></button disabled></div>
                   
                        
                       
        </div>
        

    

        </div>
        
         <div class="assessment-section">
             <div class="assessment-score"><h6>95%</h6>
                <p>ASSESSMENT SCORE</p>
            </div>

             <div class="question-correct-bx">
                <h6>19/20</h6>
                <p>QUESTION CORRECT</p>
             </div>
             <div class="time-used-bx">
                <h6>31 min</h6>
                <p>TIME USED</p>
             </div>
         </div>

    </div>

    <div class="text-area-bx">
        <div class="interview-title-bx">
<p class="interview-title"><i class="ph-bold ph-note"></i> Interview Notes/ Feedback <span class="optional">(Optional)</span></p>

        </div>
<textarea name="" id="" placeholder="Write your notes about this candidate’s interview performance...."></textarea>
    </div>

    <div class="final-decision-bx">
        <p class="final-decision-p">Make your final decision for this candidate:</p>

        <div class="btn-section">
            <button type="submit" class="accept-btn"><i class="ph-bold ph-check-square"></i> Hire Tolu</button>
            <button type="submit" class="reject-btn"><i class="ph-bold ph-x-square"></i>Reject Tolu</button>
        </div>


    </div>


    </section>


    <script src="interview-page-two.js"></script>
</body>
</html>
